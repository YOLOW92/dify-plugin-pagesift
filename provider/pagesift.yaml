identity:
  name: pagesift
  author: WU YUANCHAO
  label:
    en_US: PageSift
    zh_Hans: PageSift
  description:
    en_US: High-performance Rust-based web scraping, document extraction (PDF, DOCX, XLSX, PPTX, CSV), and LLM Markdown conversion engine.
    zh_Hans: 基于纯 Rust 的高性能网页抓取、全格式文档抽取（PDF/Word/Excel/PPT/CSV）与高质量 Markdown 转换引擎。
  icon: _assets/icon.svg

credentials_schema:
  - name: base_url
    type: text-input
    required: false
    default: "http://localhost:3002"
    label:
      en_US: PageSift Server URL
      zh_Hans: PageSift 服务地址
    placeholder:
      en_US: "e.g. http://localhost:3002 or http://pagesift:3002"
      zh_Hans: "例如 http://localhost:3002 或 http://pagesift:3002"
    help:
      en_US: "Address of your self-hosted or remote PageSift instance."
      zh_Hans: "您自建或远程的 PageSift 服务端点地址。"

  - name: api_key
    type: secret-input
    required: false
    label:
      en_US: API Key
      zh_Hans: API 密钥
    placeholder:
      en_US: "Optional bearer token if authentication is enabled"
      zh_Hans: "若 PageSift 启用了认证，请输入对应 API Key"

tools:
  - tools/read_url.yaml
  - tools/parse_document.yaml
  - tools/crawl.yaml
