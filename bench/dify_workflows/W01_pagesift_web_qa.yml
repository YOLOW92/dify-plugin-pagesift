app:
  description: 'Production E2E Workflow: Instant Webpage Scraping and QA with PageSift'
  icon: 🌐
  icon_background: '#FFEAD5'
  mode: workflow
  name: PageSift Instant Web QA
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: 1710000000001-source-1710000000002-target
      source: '1710000000001'
      sourceHandle: source
      target: '1710000000002'
      targetHandle: target
    - id: 1710000000002-source-1710000000003-target
      source: '1710000000002'
      sourceHandle: source
      target: '1710000000003'
      targetHandle: target
    - id: 1710000000003-source-1710000000004-target
      source: '1710000000003'
      sourceHandle: source
      target: '1710000000004'
      targetHandle: target
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Webpage URL
          max_length: 2048
          options: []
          required: true
          type: text-input
          variable: target_url
        - label: User Question
          max_length: 1024
          options: []
          required: true
          type: text-input
          variable: question
      height: 116
      id: '1710000000001'
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: 'PageSift Sub-millisecond Web Extraction'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        selected: false
        title: PageSift Read URL
        tool_configurations: {}
        tool_name: read_url
        tool_parameters:
          include_metadata:
            type: mixed
            value: 'true'
          only_main_content:
            type: mixed
            value: 'true'
          url:
            type: mixed
            value: '{{#1710000000001.target_url#}}'
        type: tool
      height: 98
      id: '1710000000002'
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - '1710000000002'
          - text
        desc: ''
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: gemini-2.5-flash
          provider: google
        prompt_template:
        - id: system_prompt
          role: system
          text: 'You are an intelligent research assistant. Answer the user question accurately based on the extracted webpage markdown content provided below.

Context:
{{#1710000000002.text#}}'
        - id: user_prompt
          role: user
          text: '{{#1710000000001.question#}}'
        selected: false
        title: LLM Synthesis
        type: llm
      height: 98
      id: '1710000000003'
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1710000000003'
          - text
          variable: answer
        selected: false
        title: End
        type: end
      height: 90
      id: '1710000000004'
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      selected: false
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
