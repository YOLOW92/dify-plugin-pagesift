app:
  description: 'PageSift 1.6.3 Focused Adaptive Crawl + DataGraph Cross-Source Conflict Audit'
  icon: 🕸️
  icon_background: '#F3E8FF'
  mode: workflow
  name: PageSift DataGraph Conflict Audit
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: 1710000006001-source-1710000006002-target
      source: '1710000006001'
      sourceHandle: source
      target: '1710000006002'
      targetHandle: target
    - id: 1710000006002-source-1710000006003-target
      source: '1710000006002'
      sourceHandle: source
      target: '1710000006003'
      targetHandle: target
    - id: 1710000006003-source-1710000006004-target
      source: '1710000006003'
      sourceHandle: source
      target: '1710000006004'
      targetHandle: target
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Target Site URL
          max_length: 2048
          options: []
          required: true
          type: text-input
          variable: root_url
        - label: Audit Topic Query
          max_length: 512
          options: []
          required: true
          type: text-input
          variable: topic_query
      height: 116
      id: '1710000006001'
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: 'Focused adaptive crawl with DataGraph assembly'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        selected: false
        title: Adaptive Crawl + Graph
        tool_configurations:
          adaptive: true
          attachments: true
          enable_graph: true
        tool_name: crawl
        tool_parameters:
          limit:
            type: constant
            value: 20
          query:
            type: mixed
            value: '{{#1710000006001.topic_query#}}'
          url:
            type: mixed
            value: '{{#1710000006001.root_url#}}'
        type: tool
      height: 98
      id: '1710000006002'
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: 'Query tenant-scoped cross-source conflicts detected in DataGraph'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        selected: false
        title: Query DataGraph Conflicts
        tool_configurations:
          limit: 50
        tool_name: query_graph
        tool_parameters:
          query_type:
            type: constant
            value: conflicts
        type: tool
      height: 98
      id: '1710000006003'
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1710000006002'
          - text
          variable: crawl_summary
        - value_selector:
          - '1710000006003'
          - text
          variable: conflicts_report
        selected: false
        title: End
        type: end
      height: 90
      id: '1710000006004'
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      selected: false
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
