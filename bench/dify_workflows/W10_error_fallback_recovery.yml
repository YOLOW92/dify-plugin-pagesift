app:
  description: 'Dify Workflow W10: Resilient Error Handling and Fallback Recovery with PageSift'
  icon: 🛡️
  icon_background: '#FDEDEC'
  mode: workflow
  name: PageSift Error Fallback
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    edges:
    - id: 201-202
      source: '201'
      sourceHandle: source
      target: '202'
      targetHandle: target
    - id: 202-203
      source: '202'
      sourceHandle: source
      target: '203'
      targetHandle: target
    nodes:
    - data:
        desc: 'Input Target URL'
        title: Start
        type: start
        variables:
        - label: Web Target URL
          max_length: 2048
          required: true
          type: text-input
          variable: target_url
      id: '201'
      position: {x: 100, y: 200}
      type: custom
    - data:
        desc: 'PageSift Extraction with Structured Error Guard'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        title: PageSift Read URL
        tool_configurations: {}
        tool_name: read_url
        tool_parameters:
          include_metadata: {type: mixed, value: 'true'}
          only_main_content: {type: mixed, value: 'true'}
          url: {type: mixed, value: '{{#201.target_url#}}'}
        type: tool
      id: '202'
      position: {x: 400, y: 200}
      type: custom
    - data:
        desc: 'Workflow Result Output'
        outputs:
        - value_selector: ['202', 'text']
          variable: result_text
        title: End
        type: end
      id: '203'
      position: {x: 700, y: 200}
      type: custom
    viewport: {x: 0, y: 0, zoom: 1}
