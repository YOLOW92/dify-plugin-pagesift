app:
  description: 'PageSift 1.6.3 Evidence-Grounded ContextPack RAG Workflow with Temporal Cutoff and Provenance'
  icon: 🧠
  icon_background: '#E0F2FE'
  mode: workflow
  name: PageSift ContextPack Evidence QA
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: 1710000004001-source-1710000004002-target
      source: '1710000004001'
      sourceHandle: source
      target: '1710000004002'
      targetHandle: target
    - id: 1710000004002-source-1710000004003-target
      source: '1710000004002'
      sourceHandle: source
      target: '1710000004003'
      targetHandle: target
    - id: 1710000004003-source-1710000004004-target
      source: '1710000004003'
      sourceHandle: source
      target: '1710000004004'
      targetHandle: target
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Source IDs
          max_length: 256
          options: []
          required: true
          type: text-input
          variable: source_ids
        - label: Question
          max_length: 1024
          options: []
          required: true
          type: text-input
          variable: question
      height: 116
      id: '1710000004001'
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: 'Compile token-budgeted ContextPack with MustKeep tables, qualifiers, and conflict pairs'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        selected: false
        title: PageSift ContextPack
        tool_configurations:
          must_keep_conflicts: true
          must_keep_qualifiers: true
          must_keep_table_headers: true
          ordering: edgeSalience
          selector: submodularClosure
        tool_name: context_pack
        tool_parameters:
          budget_tokens:
            type: constant
            value: 2048
          mode:
            type: constant
            value: pack
          query:
            type: mixed
            value: '{{#1710000004001.question#}}'
          source_ids:
            type: mixed
            value: '{{#1710000004001.source_ids#}}'
        type: tool
      height: 98
      id: '1710000004002'
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - '1710000004002'
          - compiled_context
        desc: ''
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: gemini-2.5-flash
          provider: google
        prompt_template:
        - id: system_prompt
          role: system
          text: 'Answer strictly from the compiled evidence ContextPack below. Cite source provenance and explicitly highlight any opposing conflicts present in the context.

ContextPack:
{{#1710000004002.compiled_context#}}'
        - id: user_prompt
          role: user
          text: '{{#1710000004001.question#}}'
        selected: false
        title: Grounded LLM Synthesis
        type: llm
      height: 98
      id: '1710000004003'
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1710000004003'
          - text
          variable: answer
        - value_selector:
          - '1710000004002'
          - provenance_manifest
          variable: provenance_manifest
        selected: false
        title: End
        type: end
      height: 90
      id: '1710000004004'
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      selected: false
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
