app:
  description: 'PageSift 1.6.3 Loop Incremental Sync -> Context Reconciliation Pipeline'
  icon: 🔄
  icon_background: '#DCFCE7'
  mode: workflow
  name: PageSift Loop Sync & Context Refresh
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: 1710000005001-source-1710000005002-target
      source: '1710000005001'
      sourceHandle: source
      target: '1710000005002'
      targetHandle: target
    - id: 1710000005002-source-1710000005003-target
      source: '1710000005002'
      sourceHandle: source
      target: '1710000005003'
      targetHandle: target
    - id: 1710000005003-source-1710000005004-target
      source: '1710000005003'
      sourceHandle: source
      target: '1710000005004'
      targetHandle: target
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Loop Source ID
          max_length: 96
          options: []
          required: true
          type: text-input
          variable: source_id
      height: 100
      id: '1710000005001'
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: 'Run one adaptive Loop sync tick (304/ETag + water-fill schedule)'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        selected: false
        title: Trigger Loop Sync Tick
        tool_configurations:
          force_all: false
        tool_name: sync_source
        tool_parameters:
          action:
            type: constant
            value: run
          source_id:
            type: mixed
            value: '{{#1710000005001.source_id#}}'
        type: tool
      height: 98
      id: '1710000005002'
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: 'Reconcile Loop SyncDeltas into persistent Context KnowledgeUnits'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        selected: false
        title: Reconcile Context Index
        tool_configurations:
          match_mode: boundedUot
        tool_name: context_ingest
        tool_parameters:
          operation:
            type: constant
            value: sync
          source_id:
            type: mixed
            value: '{{#1710000005001.source_id#}}'
        type: tool
      height: 98
      id: '1710000005003'
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1710000005002'
          - text
          variable: sync_delta_summary
        - value_selector:
          - '1710000005003'
          - text
          variable: context_visibility_summary
        selected: false
        title: End
        type: end
      height: 90
      id: '1710000005004'
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      selected: false
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
