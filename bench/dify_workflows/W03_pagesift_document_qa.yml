app:
  description: 'Production E2E Workflow: Zero-Dependency Document Parsing (PDF, Office, CSV) with PageSift'
  icon: 📄
  icon_background: '#D5F5E3'
  mode: workflow
  name: PageSift Document Parser & QA
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - pdf
      - docx
      - xlsx
      - pptx
      - csv
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: 1710000000101-source-1710000000102-target
      source: '1710000000101'
      sourceHandle: source
      target: '1710000000102'
      targetHandle: target
    - id: 1710000000102-source-1710000000103-target
      source: '1710000000102'
      sourceHandle: source
      target: '1710000000103'
      targetHandle: target
    - id: 1710000000103-source-1710000000104-target
      source: '1710000000103'
      sourceHandle: source
      target: '1710000000104'
      targetHandle: target
    nodes:
    - data:
        desc: ''
        selected: false
        title: Start
        type: start
        variables:
        - label: Uploaded Document
          max_length: 2048
          options: []
          required: true
          type: file
          variable: doc_file
        - label: User Query
          max_length: 1024
          options: []
          required: false
          type: text-input
          variable: query
      height: 116
      id: '1710000000101'
      position:
        x: 80
        y: 280
      positionAbsolute:
        x: 80
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: 'PageSift Full Format Document Extraction'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        selected: false
        title: PageSift Parse Document
        tool_configurations: {}
        tool_name: parse_document
        tool_parameters:
          enable_ocr:
            type: mixed
            value: 'false'
          file:
            type: mixed
            value: '{{#1710000000101.doc_file#}}'
        type: tool
      height: 98
      id: '1710000000102'
      position:
        x: 380
        y: 280
      positionAbsolute:
        x: 380
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        context:
          enabled: true
          variable_selector:
          - '1710000000102'
          - text
        desc: ''
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: gemini-2.5-flash
          provider: google
        prompt_template:
        - id: system_prompt
          role: system
          text: 'You are a professional financial and technical document analyst. Synthesize key insights and respond to user query based on structured markdown tables and text extracted from the document.

Document Content:
{{#1710000000102.text#}}'
        - id: user_prompt
          role: user
          text: '{{#1710000000101.query#}}'
        selected: false
        title: Document Analysis LLM
        type: llm
      height: 98
      id: '1710000000103'
      position:
        x: 680
        y: 280
      positionAbsolute:
        x: 680
        y: 280
      selected: false
      type: custom
      width: 244
    - data:
        desc: ''
        outputs:
        - value_selector:
          - '1710000000103'
          - text
          variable: analysis_result
        - value_selector:
          - '1710000000102'
          - text
          variable: raw_markdown
        selected: false
        title: End
        type: end
      height: 90
      id: '1710000000104'
      position:
        x: 980
        y: 280
      positionAbsolute:
        x: 980
        y: 280
      selected: false
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
