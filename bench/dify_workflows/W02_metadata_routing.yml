app:
  description: 'Dify Workflow W02: Metadata Extraction & Conditional Downstream Routing with PageSift'
  icon: 🧭
  icon_background: '#E8F8F5'
  mode: workflow
  name: PageSift Metadata Routing
kind: app
version: 0.1.3
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
  graph:
    edges:
    - id: 101-102
      source: '101'
      sourceHandle: source
      target: '102'
      targetHandle: target
    - id: 102-103
      source: '102'
      sourceHandle: source
      target: '103'
      targetHandle: target
    nodes:
    - data:
        desc: 'Workflow input'
        title: Start
        type: start
        variables:
        - label: Article URL
          max_length: 2048
          required: true
          type: text-input
          variable: article_url
      id: '101'
      position: {x: 100, y: 200}
      type: custom
    - data:
        desc: 'PageSift Read URL'
        provider_id: yolow92/pagesift/pagesift
        provider_name: pagesift
        provider_type: builtin
        title: PageSift Read URL
        tool_configurations: {}
        tool_name: read_url
        tool_parameters:
          include_metadata: {type: mixed, value: 'true'}
          only_main_content: {type: mixed, value: 'true'}
          url: {type: mixed, value: '{{#101.article_url#}}'}
        type: tool
      id: '102'
      position: {x: 400, y: 200}
      type: custom
    - data:
        desc: 'Output parsed metadata and body'
        outputs:
        - value_selector: ['102', 'text']
          variable: markdown_body
        - value_selector: ['102', 'json']
          variable: raw_metadata
        title: End
        type: end
      id: '103'
      position: {x: 700, y: 200}
      type: custom
    viewport: {x: 0, y: 0, zoom: 1}
