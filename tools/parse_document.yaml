identity:
  name: parse_document
  author: WU YUANCHAO
  label:
    en_US: Parse Document to Markdown
    zh_Hans: 全格式文档转 Markdown
  description:
    human:
      en_US: Parse PDF, Word (.docx), Excel (.xlsx), PowerPoint (.pptx), EPUB, and CSV into structured LLM Markdown with sub-second speed.
      zh_Hans: 毫秒级解析 PDF、Word (.docx)、Excel (.xlsx)、PPT (.pptx)、EPUB 及 CSV，生成高保真结构化 Markdown。
    llm:
      en_US: Parse document files (PDF, Word, Excel, PowerPoint, CSV) into clean Markdown. Excels at preserving complex tables and formatting.
      zh_Hans: 解析 PDF、Word、Excel、PPT 或 CSV 文档为格式规整的 Markdown。

parameters:
  - name: file_url
    type: string
    required: false
    label:
      en_US: Document URL
      zh_Hans: 文档网络地址 (URL)
    human_description:
      en_US: Public HTTP/HTTPS URL of the document file to fetch and parse.
      zh_Hans: 需要下载并解析的目标文档公开 URL。
    llm_description:
      en_US: URL of the document (PDF, DOCX, XLSX, PPTX, CSV) to parse.
      zh_Hans: 目标文档的下载链接。

  - name: file_path
    type: string
    required: false
    label:
      en_US: Local File Path
      zh_Hans: 本地文件路径
    human_description:
      en_US: Local filesystem path to the document file (when accessible).
      zh_Hans: 服务器本地文件系统路径（如上传后的暂存文件路径）。
    llm_description:
      en_US: Local file system path to the document.
      zh_Hans: 文档在本地的存储绝对路径。

  - name: enable_ocr
    type: boolean
    required: false
    default: false
    label:
      en_US: Enable OCR for Scanned Pages
      zh_Hans: 启用扫描件 OCR
    human_description:
      en_US: Enable pure-Rust OCR engine for scanned PDF pages without text layers.
      zh_Hans: 针对无文本层的扫描版 PDF，调用纯 Rust OCR 引擎识别文字。
    llm_description:
      en_US: Whether to trigger OCR for scanned or image-only PDF pages.
      zh_Hans: 是否对扫描件启用 OCR 识别。
